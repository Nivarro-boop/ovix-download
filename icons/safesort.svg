<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe6fb"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0b1b4d" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect width="256" height="256" rx="56" fill="url(#shine)"/>

  <!-- sorted stack behind -->
  <g filter="url(#drop)">
    <rect x="58" y="62" width="120" height="80" rx="12" fill="#93b4f5" opacity=".55" transform="rotate(-8 118 102)"/>
    <rect x="46" y="84" width="140" height="96" rx="14" fill="url(#paper)"/>
    <path d="M52 92 116 138a8 8 0 0 0 9.4 0L180 92" fill="none" stroke="#2f5bd3" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- shield badge -->
  <g filter="url(#drop)">
    <path d="M186 124c14 7 26 9 34 9v30c0 24-15 40-34 48-19-8-34-24-34-48v-30c8 0 20-2 34-9Z" fill="url(#shield)" stroke="#fff" stroke-width="7" stroke-linejoin="round"/>
    <path d="m171 166 11 11 21-23" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
